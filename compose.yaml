services:
  frontend:
    build:
      context: ./frontend
      target: base
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["bun", "dev"]
    env_file:
      - .env
    environment:
      # - API_URL=http://backend:8000
      - API_URL=https://weekly-report-api-kagami.fly.dev/
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
    # ホットリロードのためにコマンドを上書き（開発時のみ）
    command:
      [
        'uv',
        'run',
        'uvicorn',
        'main:app',
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
        '--reload',
      ]

  db:
    image: postgres:17
    container_name: weekly-report-db
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
